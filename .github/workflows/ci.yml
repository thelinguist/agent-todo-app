name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run test:api

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E against local servers
        run: bun run test:e2e
      - name: E2E against deployed app
        # Set the repository variable E2E_DEPLOYED_URL to enable this step.
        if: ${{ vars.E2E_DEPLOYED_URL != '' }}
        run: bun run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_DEPLOYED_URL }}
